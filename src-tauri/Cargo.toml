[package]
name = "notely-desktop"
version = "1.1.0"
description = "Notely desktop audio transcriber"
authors = ["Notely Contributors"]
edition = "2021"

[lib]
name = "notely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
