name: Build Notely Native Rust Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Keep Python text IO consistent on Windows runners.
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows x64 - 100% Native Rust + Compact NSIS
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-native -> target

      - name: Install isolated engine dependencies
        shell: pwsh
        run: |
          python -m venv .build-venv
          ./.build-venv/Scripts/python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.build-venv/Scripts/python.exe -m pip install "pyinstaller>=6.11,<7" -r backend/engine/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build_reports | Out-Null
          ./.build-venv/Scripts/python.exe -m pip freeze | Out-File -Encoding utf8 build_reports/python-resolved.txt

      - name: Test Python backend and contracts
        shell: pwsh
        run: |
          ./.build-venv/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.build-venv/Scripts/python.exe -m compileall -q backend scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build compact AI sidecar engine without bundled CUDA
        shell: pwsh
        run: |
          ./.build-venv/Scripts/python.exe scripts/build_engine.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.build-venv/Scripts/python.exe scripts/smoke_engine.py dist/notely-engine/notely-engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build 100% Native Rust Desktop UI (notely-desktop.exe)
        working-directory: src-native
        run: cargo build --release

      - name: Package Windows NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-native | Out-Null
          $ver = (Select-String -Path src-native/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $ver) { $ver = "2.0.0" }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = (Get-Command makensis -ErrorAction Stop).Source
          }
          & $makensis "/DAPP_VERSION=$ver" scripts/notely-native.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed layout and real uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-native/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing in dist-native/' }
          ./scripts/test_installer.ps1 -Installer $installer.FullName

      - name: Record installer sizes and checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist-native/*.exe)
          if ($files.Count -eq 0) { throw 'Installer not found' }
          $rows = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            "$($f.Name): $([math]::Round($f.Length/1MB,2)) MiB; SHA256 $hash"
          }
          $rows | Out-File -Encoding utf8 build_reports/installer-size.txt
          if (Test-Path build_reports/engine-size.md) {
            Get-Content build_reports/engine-size.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          $rows | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path src-native/Cargo.lock) {
            Copy-Item src-native/Cargo.lock build_reports/Cargo.lock
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Notely-Native-Windows-Installer
          path: dist-native/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Notely-Build-Reports
          path: |
            build_reports/
            build/notely-engine/warn-notely-engine.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish direct installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('Notely {0}', github.ref_name) }}
          body: |
            **Notely v2.0.0 — 100% Pure Native Rust Desktop UI (Tanpa WebView2 / Browser)**

            Unduh file installer **.exe** langsung di bawah ini pada bagian **Assets** (langsung dapat dijalankan tanpa perlu ekstrak file .zip).
          files: |
            dist-native/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
